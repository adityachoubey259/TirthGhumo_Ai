services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tour_api
      POSTGRES_USER: tour
      POSTGRES_PASSWORD: tour
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tour -d tour_api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
